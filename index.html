<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaaS зертханалық жұмысы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="icon">☁️</div>

            <h1>PaaS ортасындағы веб-қосымша</h1>

            <h2></h2>

            <p>
                Мен PaaS технологиясын пайдаланып қарапайым
                веб-қосымшаны интернетке орналастырдым.
            </p>

            <div class="info">
                <p><b>Пән:</b> Бұлттық технологиялар</p>
                <p><b>Технология:</b> HTML + CSS</p>
                <p><b>Платформа:</b> Netlify</p>
                <p><b>Репозиторий:</b> GitHub</p>
            </div>

            <p id="message"></p>
        </div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "✅ Веб-қосымша сәтті жұмыс істеп тұр!";
        }
    </script>

</body>
</html>
